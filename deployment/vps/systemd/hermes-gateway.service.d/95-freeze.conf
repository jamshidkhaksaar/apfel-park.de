# Installed 2026-10-24 after the Hermes safety audit.
# Keeps the gateway stopped while the emergency stop is engaged, including
# after a reboot (the previous Restart=no lived in volatile /run).
# 2026-10-27, after the 2026-10-21 incident was closed and ESTOP was removed:
# the incident brake (Restart=no) becomes bounded automatic recovery. The main
# unit pairs Restart=always with StartLimitIntervalSec=0 -- an unlimited 5s
# retry loop, which is what the incident exposed -- so the three settings below
# are what keep a crash loop bounded: 3 starts per 15 minutes, 30s apart. Once
# the burst is exhausted the unit stays failed until an operator runs
# `systemctl reset-failed hermes-gateway` and starts it. Exit 78 still
# prevents a restart, exit 75 still forces one, and the condition below still
# gates every start on the emergency stop being absent.
[Unit]
ConditionPathExists=!/root/.hermes/ESTOP
StartLimitIntervalSec=900
StartLimitBurst=3

[Service]
Restart=on-failure
RestartSec=30
