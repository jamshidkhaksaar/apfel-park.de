# Hermes safety boundary installed 2026-10-23, extended 2026-10-24 and 2026-10-27.
# The 2026-10-27 extension hides the deploy tooling checkout, which became the
# deployment entrypoint when it moved out of the source clone.
# The 2026-10-24 extension narrows the writable home from all of /root to the
# four state/cache paths below, hides root SSH material and the remaining
# secret copies, and applies on the next authorized gateway start. It does not
# restart the currently running process. /srv/apfel-park stays read-only and the
# build/deploy/system-control paths stay hidden. Do not remove this drop-in
# without a reviewed replacement.
[Service]
ProtectSystem=strict
ReadWritePaths=/root/.hermes /root/.cache /root/.config /root/.local
ReadOnlyPaths=/srv/apfel-park
ProtectHome=read-only
PrivateTmp=yes
CapabilityBoundingSet=
NoNewPrivileges=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes

# systemd/D-Bus and container control sockets.
InaccessiblePaths=-/run/systemd/private -/run/dbus/system_bus_socket -/run/user/0/bus
InaccessiblePaths=-/run/docker.sock -/var/run/docker.sock
InaccessiblePaths=-/run/containerd/containerd.sock -/var/run/containerd/containerd.sock

# System/container control binaries.
InaccessiblePaths=-/usr/bin/systemctl -/usr/bin/systemd-run -/usr/bin/busctl
InaccessiblePaths=-/usr/bin/nsenter -/usr/bin/docker -/usr/bin/ctr
InaccessiblePaths=-/usr/bin/dbus-send -/usr/bin/gdbus

# Node/package-manager runtimes, including Hermes' own bundled runtimes.
InaccessiblePaths=-/usr/bin/node -/usr/local/bin/node -/usr/bin/corepack
InaccessiblePaths=-/root/.nvm -/root/.hermes/node
InaccessiblePaths=-/root/.hermes/tools/node-26.7.0-linux-x64
InaccessiblePaths=-/root/.hermes/tools/npm-12.0.2-linux-x64
InaccessiblePaths=-/opt/apfel-node
InaccessiblePaths=-/root/apfel-park-sellable-options/node_modules

# Isolated build runner, build state and logs.
InaccessiblePaths=-/usr/local/sbin/apfel-build-run -/usr/local/sbin/apfel-build-gate
InaccessiblePaths=-/srv/apfel-park/builds -/var/log/apfel-build -/var/lib/apfel-build

# Human-only deployment authorization and operational alert helpers.
InaccessiblePaths=-/usr/local/sbin/apfel-deploy
InaccessiblePaths=-/usr/local/sbin/apfel-alert -/usr/local/sbin/apfel-alert-email
InaccessiblePaths=-/usr/local/sbin/vps-health-alert
InaccessiblePaths=-/etc/apfel-park
InaccessiblePaths=-/var/log/apfel-deploy.log

# Deployment entrypoints and the preserved incident bypass. The deploy tooling
# checkout is hidden whole: every file in it exists only to run deploys.
InaccessiblePaths=-/srv/apfel-park/app/current/deployment/vps/scripts/deploy-app.sh
InaccessiblePaths=-/srv/apfel-park/app/source/deployment/vps/scripts/deploy-app.sh
InaccessiblePaths=-/srv/apfel-park/app/deploy
InaccessiblePaths=-/root/.hermes/cache/scratch/apfel-resume-verified-release.sh

# Keep the emergency-stop marker visible to the operator but not removable by
# the sandboxed process. The wrapper also checks it independently.
InaccessiblePaths=-/root/.hermes/ESTOP

# Production secrets are not needed by the gateway's normal research work.
InaccessiblePaths=-/srv/apfel-park/app/shared/app.env
InaccessiblePaths=-/srv/apfel-park/mail/.env
InaccessiblePaths=-/opt/apfelparkbewertungen/app/deploy/production.env
InaccessiblePaths=-/etc/shadow

# Root SSH material is a persistence path: /root is no longer writable, and the
# directory is hidden as defense in depth.
InaccessiblePaths=-/root/.ssh

# Secondary credential and infrastructure copies under /root.
InaccessiblePaths=-/root/apfel-park-infra

# Worktree copies of the deployment scripts (the release and source copies are
# hidden above; these are readable copies in a writable feature worktree).
InaccessiblePaths=-/root/apfel-park-sellable-options/deployment
InaccessiblePaths=-/root/apfel-park-sellable-options/scripts/deploy.sh
