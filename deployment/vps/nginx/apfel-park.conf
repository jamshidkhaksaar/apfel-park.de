server {
    listen 80;
    listen [::]:80;
    server_name apfel-park.de www.apfel-park.de;
    root /var/www/apfel-park;
    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/apfel-park;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apfel-park.de www.apfel-park.de;
    root /var/www/apfel-park;
    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/apfel-park.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apfel-park.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 502 503 504 /maintenance.html;

    location /uploads/ {
        alias /srv/apfel-park/app/shared/uploads/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /_next/static/ {
        alias /srv/apfel-park/app/current/.next/static/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location = /maintenance.html {
        internal;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mail.apfel-park.de;
    root /var/www/apfel-park;

    location /.well-known/acme-challenge/ {
        root /var/www/apfel-park;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.apfel-park.de;

    ssl_certificate /etc/letsencrypt/live/apfel-park.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apfel-park.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        proxy_cookie_flags roundcube_sessid secure httponly samesite=strict;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
