# AEO markdown twins (AEO Specification v1.0, https://dualmark.dev/docs/spec).
#
# The app already serves /<path>.md for every page that has a twin, the deploy
# probe checks those, and the app advertises the twin on the HTML response with
# Link rel="alternate" (src/proxy.ts). That Link reaches the client untouched:
# Next appends its preload links as separate header lines instead of replacing
# it, so nginx does not repeat it -- it used to, and the response advertised the
# twin twice.
#
# Vary is the header the app cannot own: Next.js writes its own Vary on page
# responses, without Accept, replacing whatever the app set. nginx is the last
# write before the client, so it owns Vary here.
#
# The map must live in the http context, which is where sites-enabled files
# are included.

# Vary is rewritten rather than appended so the header stays single-valued and
# the spec's "Accept, without duplication" holds. gzip_vary is off in the proxied
# location for the same reason: it would add a second Vary header, and a parser
# that reads only the first one would still see a Vary without Accept. The
# fallback keeps the Accept-Encoding token that gzip_vary would have supplied,
# so compressed responses stay correctly keyed everywhere else.
map "$upstream_status:$upstream_http_content_type" $aeo_vary {
    default "Accept-Encoding";
    # §4: the 406 has to carry Vary: Accept, and it is text/plain, so it needs
    # its own entry rather than riding on the content-type match below.
    "~^406:" "Accept, Accept-Encoding";
    "~*:text/(html|markdown)(;|$)" "Accept, Accept-Encoding";
}

server {
    listen 80;
    listen [::]:80;
    server_name apfel-park.de www.apfel-park.de;
    root /var/www/apfel-park;
    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/apfel-park;
    }

    location = / {
        return 301 https://apfel-park.de/de;
    }

    location / {
        return 301 https://apfel-park.de$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.apfel-park.de;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    ssl_certificate /etc/letsencrypt/live/apfel-park.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apfel-park.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        return 301 https://apfel-park.de/de;
    }

    location / {
        return 301 https://apfel-park.de$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apfel-park.de;
    root /var/www/apfel-park;
    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/apfel-park.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apfel-park.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # AEO Spec v1.0 §3. Vary belongs at server level rather than inside
    # `location /`, because add_header in a location switches inheritance off:
    # declaring it there would silently drop the four headers above from every
    # proxied response.
    add_header Vary $aeo_vary always;

    error_page 502 503 504 /maintenance.html;

    location /uploads/ {
        alias /srv/apfel-park/app/shared/uploads/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    location /_next/static/ {
        alias /srv/apfel-park/app/shared/next-static/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        # Keep one edge policy; Next.js still protects direct upstream responses.
        proxy_hide_header Strict-Transport-Security;
        # Next.js copies the middleware rewrite target onto the response, which would
        # expose the internal upstream address on rewritten URLs (markdown twins,
        # missing products). No client reads it: the client-facing rewrite headers
        # are x-nextjs-rewritten-path/-query, which stay untouched.
        proxy_hide_header x-middleware-rewrite;
        # The server block supplies Vary (§3); all this has to do is remove
        # what Next writes and what gzip_vary would add, so a response carries
        # exactly one Vary with Accept in it. Link is not touched: the app's
        # alternate reaches the client as its own header line.
        proxy_hide_header Vary;
        gzip_vary off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    location = /maintenance.html {
        internal;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mail.apfel-park.de;
    root /var/www/apfel-park;

    location /.well-known/acme-challenge/ {
        root /var/www/apfel-park;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.apfel-park.de;

    ssl_certificate /etc/letsencrypt/live/apfel-park.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apfel-park.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        proxy_cookie_flags roundcube_sessid secure httponly samesite=strict;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
