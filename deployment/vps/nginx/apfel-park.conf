# AEO markdown twins (AEO Specification v1.0, https://dualmark.dev/docs/spec).
#
# The app already serves /<path>.md for every page that has a twin, and the
# deploy probe checks those. Two headers the spec requires on the *HTML*
# response cannot come from the app: Next.js writes Vary itself on page
# responses and rebuilds Link for its own preloads, so a header set in
# src/proxy.ts is gone before the response leaves the app. nginx is the last
# write before the client, so it owns both here.
#
# These maps must live in the http context, which is where sites-enabled files
# are included. add_header skips a directive whose value is an empty string, so
# "not applicable" is expressed as an empty value.

# Advertise the twin of a page that has one. A markdown twin itself does not
# advertise an alternate (it links back with rel="canonical" instead), and
# neither does anything with a file extension.
#
# The excluded paths mirror two lists in src/lib/md/routes.ts: PRIVATE_PREFIXES
# (never reachable through the markdown handler) and markdownSkips (public pages
# that deliberately have no twin yet). Advertising a twin that answers 404 would
# be worse than not advertising it, so when the app gains a twin for one of
# these pages, drop it from the list below.
map "$upstream_http_content_type:$uri" $aeo_md_alternate {
    default "";
    "~*^text/html[^:]*:/(de|en)/(cart|checkout|login|maintenance|store/preview|delivery-returns|device-conditions|withdrawal|trade-in|firmenkunden|handy-shop-hamburg-wilhelmsburg|ratgeber/smartphone-laenger-nutzen|repairs/preisvergleich-hamburg)(/|$)" "";
    "~*^text/html[^:]*:(?<twin>/(de|en)(/[^.?]*[^/.])?)/?$"     "<$twin.md>; rel=\"alternate\"; type=\"text/markdown\"";
}

# Vary is rewritten rather than appended so the header stays single-valued and
# the spec's "Accept, without duplication" holds. gzip_vary is off in the proxied
# location for the same reason: it would add a second Vary header, and a parser
# that reads only the first one would still see a Vary without Accept. The
# fallback keeps the Accept-Encoding token that gzip_vary would have supplied,
# so compressed responses stay correctly keyed everywhere else.
map $upstream_http_content_type $aeo_vary {
    default "Accept-Encoding";
    "~*^text/(html|markdown)(;|$)" "Accept, Accept-Encoding";
}

server {
    listen 80;
    listen [::]:80;
    server_name apfel-park.de www.apfel-park.de;
    root /var/www/apfel-park;
    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/apfel-park;
    }

    location = / {
        return 301 https://apfel-park.de/de;
    }

    location / {
        return 301 https://apfel-park.de$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.apfel-park.de;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    ssl_certificate /etc/letsencrypt/live/apfel-park.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apfel-park.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        return 301 https://apfel-park.de/de;
    }

    location / {
        return 301 https://apfel-park.de$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apfel-park.de;
    root /var/www/apfel-park;
    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/apfel-park.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apfel-park.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 502 503 504 /maintenance.html;

    location /uploads/ {
        alias /srv/apfel-park/app/shared/uploads/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    location /_next/static/ {
        alias /srv/apfel-park/app/shared/next-static/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        # Keep one edge policy; Next.js still protects direct upstream responses.
        proxy_hide_header Strict-Transport-Security;
        # Next.js copies the middleware rewrite target onto the response, which would
        # expose the internal upstream address on rewritten URLs (markdown twins,
        # missing products). No client reads it: the client-facing rewrite headers
        # are x-nextjs-rewritten-path/-query, which stay untouched.
        proxy_hide_header x-middleware-rewrite;
        proxy_hide_header Vary;
        gzip_vary off;
        add_header Vary $aeo_vary always;
        add_header Link $aeo_md_alternate always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    location = /maintenance.html {
        internal;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mail.apfel-park.de;
    root /var/www/apfel-park;

    location /.well-known/acme-challenge/ {
        root /var/www/apfel-park;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.apfel-park.de;

    ssl_certificate /etc/letsencrypt/live/apfel-park.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apfel-park.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        proxy_cookie_flags roundcube_sessid secure httponly samesite=strict;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
