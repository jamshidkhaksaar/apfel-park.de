name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One list of gates, shared with the release gate in
      # deployment/vps/scripts/deploy-app.sh and runnable anywhere node runs:
      # lint, typecheck, the unused-source audit, the test suite, the dependency
      # audit and the production build. Add a check there, not here.
      - name: Commit checks and production build
        run: npm run ci:check
